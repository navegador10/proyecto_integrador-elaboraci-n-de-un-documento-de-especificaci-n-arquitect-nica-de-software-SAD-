name: Render PlantUML diagrams

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'diagramas/**.puml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Render PlantUML diagrams (SVG + PNG)
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" plantuml/plantuml:latest -tsvg /workspace/diagramas/*.puml || true
          docker run --rm -v "${{ github.workspace }}:/workspace" plantuml/plantuml:latest -tpng /workspace/diagramas/*.puml || true

      - name: Commit and push generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagramas/*.png diagramas/*.svg || true
          git commit -m "chore: render PlantUML diagrams" || echo "No changes to commit"
          git push
